name: Daily ledger

# Schedule plus a manual run. This does not run on push.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print counts and write nothing
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  daily:
    name: Settle, publish, export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: python -m src.jobs.daily --dry-run

      - name: Run and commit
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: python -m src.jobs.daily --commit

      - name: Push the ledger commit
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        run: git push

      - name: Open an issue when the run fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily ledger failed";
            const body = [
              "The daily ledger command failed.",
              "",
              `Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              "",
              "A failed run is not a new slate. The command writes only after its checks pass.",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const found = existing.data.find((issue) => issue.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
